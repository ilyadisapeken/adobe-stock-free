name: Adobe Stock QC

on:
  push:
    paths:
      - "generated/**"
  workflow_dispatch:

jobs:
  qc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Prepare folders
        run: |
          mkdir -p ready
          mkdir -p rejected

      - name: Check generated images
        run: |
          found=0

          for file in generated/*.jpg generated/*.jpeg generated/*.JPG generated/*.JPEG; do
            if [ -f "$file" ]; then
              found=1

              echo "================================"
              echo "Checking: $file"
              echo "================================"

              if python qc/check_image.py "$file"; then
                cp "$file" ready/
                echo "READY: $file"
              else
                cp "$file" rejected/
                echo "REJECTED: $file"
              fi
            fi
          done

          if [ "$found" -eq 0 ]; then
            echo "Tidak ada gambar JPEG di generated/"
          fi

      - name: Create metadata
        run: |
          python qc/create_metadata.py

      - name: Upload QC results
        uses: actions/upload-artifact@v4
        with:
          name: adobe-stock-results
          path: |
            ready/
            rejected/
            metadata.json
          if-no-files-found: ignore
