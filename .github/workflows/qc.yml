name: Adobe Stock QC

on:
  workflow_dispatch:

jobs:
  qc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Check project
        run: |
          python -m py_compile qc/check_image.py
          echo "QC script berhasil dipasang."
